[workspace]
resolver = "2"
members = [
    "crates/anigpu-core",
    "crates/anigpu-server",
    "crates/anigpu-mpv",
    "crates/anigpu-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"

[workspace.dependencies]
anigpu-core = { path = "crates/anigpu-core" }
anigpu-mpv = { path = "crates/anigpu-mpv" }

reqwest = { version = "0.13", features = ["json", "gzip", "form"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = "0.27"
regex = "1"
thiserror = "2"
async-trait = "0.1"
urlencoding = "2"
anyhow = "1"

axum = "0.8"
tower-http = { version = "0.7", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

eframe = "0.36"
egui = "0.36"
egui_extras = "0.36"
image = "0.25"
libloading = "0.9"
directories = "6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
